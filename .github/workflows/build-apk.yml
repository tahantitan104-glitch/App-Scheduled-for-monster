name: Build Resolve APK

on:
  push:
    branches:
      - "**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK licenses
        run: |
          if command -v sdkmanager >/dev/null 2>&1; then
            yes | sdkmanager --licenses >/dev/null 2>&1 || true
          elif [ -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
          fi

      - name: Restore debug keystore
        run: |
          if [ ! -f debug.keystore ]; then
            if [ -f debug.keystore.base64 ]; then
              base64 -d debug.keystore.base64 > debug.keystore
            else
              keytool -genkeypair -v -keystore debug.keystore \
                -storepass android -alias androiddebugkey -keypass android \
                -keyalg RSA -keysize 2048 -validity 10000 \
                -dname "CN=Android Debug,O=Android,C=US"
            fi
          fi

      - name: Setup Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Build Resolve Debug APK
        run: gradle :app:assembleDebug --no-daemon --console=plain

      - name: Prepare APK output
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/Resolve-debug.apk
          ls -lh dist/Resolve-debug.apk

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Resolve-debug-apk
          path: dist/Resolve-debug.apk
          if-no-files-found: error

      - name: Publish Direct Download APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        continue-on-error: true
        with:
          tag_name: latest-apk
          name: Resolve App (Installable Debug APK)
          body: |
            Installable Android APK for **Resolve** (`com.resolve.focus`, Android 9+ / API 28+).

            1. Tap `Resolve-debug.apk` below to download directly on your Android phone.
            2. Open the downloaded `.apk` file and allow **Install unknown apps** if prompted.
            3. Open **Resolve** -> **Settings** -> set a Recovery Code and enable **Resolve Focus Guard** under Accessibility Services.
          files: dist/Resolve-debug.apk
          overwrite_files: true
          make_latest: true
